# Nightly scientific validation (validation/cases). Fails on any FAIL or ERROR case.
# NOT_IMPLEMENTED cases are expected until Phase 2; `--strict` is added at the Phase 2 exit.
name: Validate

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "validation/**"
      - "docs/refs.bib"
      - "packages/py/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v2
      - run: uv sync --locked
      - run: just validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-last-run
          path: validation/last-run.json
