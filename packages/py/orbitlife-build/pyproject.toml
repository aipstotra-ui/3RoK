# Not published. Builds the data products (radiation and density grids, trained models)
# that the orbitlife package downloads. Heavy dependencies (SpacePy/IRBEM, pymsis, LightGBM)
# are added here in later phases so they never reach orbitlife users.
[project]
name = "orbitlife-build"
version = "0.0.0"
description = "Private builders for orbitlife data products and models."
requires-python = ">=3.11"
dependencies = ["orbitlife"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbitlife_build"]
