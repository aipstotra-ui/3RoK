id: radiation-shields1-novice-front-3gcm2
title: Reproduce the source's own AP8/AE8 model, front slab only, 3.00 g/cm2 Al, 500 km / 85 deg (same-model check)
module: radiation
check: implementation
target: orbitlife.radiation.tid_dose_rad_si
inputs:
  altitude_km: 500.0
  inclination_deg: 85.0
  start_epoch_utc: "2018-12-16T00:00:00Z"
  duration_yr: 1.0
  geometry: slab_one_sided                  # front slab only (2 pi), as in the source's 'Modeled TID' column
  shielding_g_cm2_al: 3.00
  target_material: si
  trapped_proton_model: ap8min              # ASSUMPTION: source says only 'AP8 AE8'; mission was at solar minimum
  trapped_electron_model: ae8min            # ASSUMPTION: as above
  solar_proton_model: null                  # source included SOLPRO (King); its share is not stated (see notes)
quantity: total ionizing dose in one year, front 2 pi only
unit: rad(Si)
reference:
  value: 22.13
  uncertainty: 0.09
  source: thomsen2022shields1
  locator: "slide text: '1 year mission, AP8 AE8 ... SOLPRO (King) Model'; results table, UDOS 2: 'Modeled TID (Proton (p) & Electron (e)) (Rad (Si))' = 21.77 p + 0.36 e = 22.13"
  status: CONFIRMED
  note: "Verified against the PDF by the main agent (2026-10-06). The source's model: AP8 AE8 trapped belts plus SOLPRO (King) solar protons, NOVICE shielding approximation, infinite slab."
tolerance:
  kind: factor
  value: 1.5
  rationale: >-
    Design choice. Unknowns: the AP8/AE8 epoch (min vs max), the geomagnetic field model and epoch used for AP8/AE8
    B,L (it moves the SAA, and the effect at 500 km can be as large as this tolerance), the SOLPRO share, and NOVICE's
    slab treatment vs SHIELDOSE-2. A factor of 1.5 catches the classic bug classes (one- vs two-sided slab, 2 pi vs
    4 pi, g/cm2 vs mm, rad vs Gy, per day vs per year) but not 20-40% transport differences. It does NOT by itself
    separate code error from physics: a pass bounds our departure from NOVICE to <=1.5x, so at least 1.37x of the
    gap to the measurement is attributed to the environment model or a missing population. Always report the actual ratio.
notes: >-
  Same-model companion to radiation-shields1-slab-al-3gcm2 (Phase 1 extension E2, expert-skeptic gap 7). If this
  case passes and the physics case misses, the residual is attributable to the AP8/AE8 environment or a missing
  population, not to our transport code. The proton share is 21.77 of 22.13 rad(Si); SOLPRO solar protons may sit
  inside it, so a low miss here could be the excluded SOLPRO term. The test is asymmetric: a trapped-only result
  more than 1.5x ABOVE the reference is unambiguously ours, while a low miss is ambiguous. Also log the AP8MAX result
  as a diagnostic once code exists (physics-reviewer, E2).
