id: radiation-shields1-slab-al-3gcm2
title: Shields-1 measured TID behind 3.00 g/cm2 Al slab, 500 km / 85 deg (2019, solar minimum)
module: radiation
check: physics
target: orbitlife.radiation.tid_dose_rad_si
inputs:
  altitude_km: 500.0
  inclination_deg: 85.0
  start_epoch_utc: "2018-12-16T00:00:00Z"   # launch date; the measured value is quoted per year
  duration_yr: 1.0
  shielding_mm_al: 11.1                       # 3.00 g/cm2 Al; source gives 1.11 cm
  geometry: slab_2pi_thick_backing           # "infinite slab ... thick backing", 2 pi omnidirectional
  target_material: si
quantity: total ionizing dose in one year
unit: rad(Si)
reference:
  value: 73.6
  uncertainty: 3.2
  source: thomsen2022shields1
  locator: "results table, UDOS 2: Experimental TID (Rad (Si))/Year"
  status: CONFIRMED
  note: "Verified against the PDF by the main agent (2026-10-06). The source's own AP8/AE8 + SOLPRO model (NOVICE) gives 22.13 rad(Si), 3.3x below the measurement."
tolerance:
  kind: factor
  value: 2.0
  rationale: "Design choice: the per-year rate is extrapolated from an accumulation interval the source does not state, and slab geometry with thick backing is approximate. A FAIL here (AP8/AE8-based models under-predict ~3x in the source) is the honest, documented miss; do not widen."
notes: >-
  Physics case: real flight measurement. Expected to expose the known under-prediction of static AP8/AE8
  climatology at 500 km polar orbits near solar minimum. Report the residual in the validation report.
