id: radiation-tid-sso800-dawndusk-5yr-2p5mm
title: 5-year TID behind 2.5 mm Al, 800 km dawn-dusk SSO (SPENVIS AP8/AE8 + ESP + SHIELDOSE-2)
module: radiation
check: implementation
target: orbitlife.radiation.tid_dose_rad_si
inputs:
  altitude_km: 800.0            # mean a - 6378.137 km, circular
  sun_synchronous: true
  ltan_h: 6.0
  start_epoch_utc: "2011-01-01T00:00:00Z"
  duration_yr: 5.0
  shielding_mm_al: 2.5
  geometry: solid_sphere_center
  target_material: si
  trapped_proton_model: ap8min
  trapped_electron_model: ae8max
  solar_proton_model: esp_psychic
  solar_proton_confidence: 0.80
quantity: total ionizing dose over the mission
unit: rad(Si)
reference:
  value: 17620
  source: sinclair2013radiation
  locator: "Table 1 (inputs), Table 3 (sectoring), text: SHIELDOSE-2 centre of Al spheres, silicon target"
  status: CONFIRMED
  computed_with: "Table 3: 9.34 krad x (1/0.53); fraction 53%, chassis side. The paper states each contributed dose = SHIELDOSE-2 total dose x fraction of sphere, so dividing recovers the full-sphere dose. Rounding of the published table: ±1.0%. Verified against the PDF by the main agent (2026-10-06)."
tolerance:
  kind: rel
  value: 0.10
  rationale: "Roadmap target for same-model SPENVIS comparisons (±10% over 1-20 mm). Includes the published-table rounding (±1.0%) and differences in orbit sampling and SPENVIS version."
notes: >-
  Mixed epochs (AP-8 solar minimum with AE-8 solar maximum) as chosen in the source. The total includes trapped
  protons, trapped electrons (with bremsstrahlung) and ESP-PSYCHIC solar protons at 80% confidence.
