id: orbit-eclipse-iss-415-umbra
title: Eclipse duration (umbra), 415.0 km at beta -28.163 deg (Orekit, conical shadow, spherical Earth)
module: orbit
check: implementation
target: orbitlife.orbit.eclipse_duration_min
inputs:
  altitude_km: 415.0
  beta_deg: -28.163050
  shadow_model: conical_umbra
  sun_distance_au: 1.016196
quantity: time per revolution in umbra
unit: min
reference:
  value: 34.4302
  source: orekit_13_1_9
  locator: "orekit_refs.out.json, orbits.iss-415.umbra_min"
  status: CONFIRMED
  computed_with: "Orekit 13.1.9 via orekit-jpype 13.1.9.0; orekit-data commit 2422a7d (zip sha256 3f1cdf30d802f5e3...); generator validation/generators/orekit_refs.py; output validation/generators/orekit_refs.out.json. Two-body propagation from 2025-06-21T00:00:00Z; EclipseDetector, Sun radius Constants.SUN_RADIUS, Earth sphere R = 6378.137 km, threshold 1e-4 s."
tolerance:
  kind: abs
  value: 0.1
  rationale: "Our analytic model holds beta fixed; in Orekit the Sun moves ~0.07 deg during one revolution. 6 s covers that and event timing, while a cylindrical-vs-conical or umbra-vs-penumbra mix-up (0.2-0.5 min here) still fails."
