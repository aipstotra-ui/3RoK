# Reference AI workloads (Phase 1.3). Sources: docs/research/phase1-workloads.md; all values below verified
# directly by the main agent on 2026-10-06.
# Weight memory (parameters x precision) is ONE input to upset exposure. Phase 4 adds activations, KV/state
# caches, optimizer state, registers and control logic; a weights-only exposure model would under-count upsets.
schemaVersion: 1
workloads:
  - id: resnet50-inference
    name: ResNet-50 image classification, inference
    phase: inference
    model_name: torchvision ResNet50_Weights.IMAGENET1K_V1
    parameters: {value: 25557032, source: torchvision_resnet50_weights, locator: "weights table: num_params", status: CONFIRMED}
    precision: {value: 32, design_choice: "fp32 as distributed (97.8 MB file / 25.56M params = ~4 bytes per weight); reduced-precision variants are separate workloads"}
    flops_per_item: {value: 4.09e9, source: torchvision_resnet50_weights, locator: "weights table: GFLOPS 4.09", status: CONFIRMED,
                     note: "Same model as the weights (torchvision ResNet V1.5). The page does not state whether 'GFLOPS' counts multiply-adds (UNVERIFIED convention). The original ResNet-50 of he2016resnet is 3.8e9 multiply-adds."}
    benchmark:
      name: ImageNet-1K top-1 (torchvision eval transforms)
      unit: "%"
      result: {value: 76.13, source: torchvision_resnet50_weights, locator: "weights table: acc@1", status: CONFIRMED}
    license: {name: BSD-3-Clause (torchvision code), source: torchvision_repo, locator: "GitHub repository licence", status: CONFIRMED,
              note: "Terms of the ImageNet-trained weights not researched (UNVERIFIED)"}

  - id: nemotron3-nano-4b-inference
    name: NVIDIA Nemotron-3-Nano-4B, inference
    phase: inference
    model_name: nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16
    parameters: {value: 3973556832, source: hf_nemotron3_nano_4b, locator: "HF API safetensors total", status: CONFIRMED}
    precision: {value: 16, source: hf_nemotron3_nano_4b, locator: "config.json torch_dtype: bfloat16", status: CONFIRMED}
    context_length: {value: 262144, source: hf_nemotron3_nano_4b, locator: "config.json max_position_embeddings", status: CONFIRMED,
                     note: "Maximum positions in the config; the usable context may be stated differently on the model card (not checked)"}
    license: {name: NVIDIA Nemotron Open Model License, source: nvidia_nemotron_oml, locator: "licence text: grant and §3 Redistribution", status: CONFIRMED,
              note: "Commercially usable; derivative works allowed; redistribution needs a copy of the licence and the notice 'Licensed by NVIDIA Corporation under the NVIDIA Nemotron Model License.' Not gated."}
    note: >-
      Hybrid Mamba-Transformer (nemotron_h, 42 layers; config hybrid_override_pattern: mostly Mamba-2 blocks with a
      few attention blocks). Chosen by Aiden (NVIDIA-built, permissive licence). The fault-injection studies
      reviewed here cover CNNs and Transformer LLMs; none covers Mamba/SSM hybrids (no targeted literature search done).
      No benchmark recorded yet (model-card scores not verified).

  - id: nemotron3-nano-4b-training-step
    name: NVIDIA Nemotron-3-Nano-4B, one training step
    phase: training
    model_name: nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16
    parameters: {value: 3973556832, source: hf_nemotron3_nano_4b, locator: "HF API safetensors total", status: CONFIRMED}
    precision: {value: 16, design_choice: "bf16 mixed-precision training; fp32 master weights and optimizer state are modelled separately in Phase 4"}
    license: {name: NVIDIA Nemotron Open Model License, source: nvidia_nemotron_oml, locator: "licence text: grant and §3 Redistribution", status: CONFIRMED}
    note: "Training memory (gradients, optimizer state, activations) is several times the weights; Phase 4 defines it."
