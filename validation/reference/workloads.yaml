# Reference AI workloads (Phase 1.3). Sources: docs/research/phase1-workloads.md; all values below verified
# directly by the main agent on 2026-10-06. Memory footprint (parameters x precision) drives upset exposure.
schemaVersion: 1
workloads:
  - id: resnet50-inference
    name: ResNet-50 image classification, inference
    phase: inference
    model_name: torchvision ResNet50_Weights.IMAGENET1K_V1
    parameters: {value: 25557032, source: torchvision_resnet50_weights, locator: "weights table: num_params", status: CONFIRMED}
    precision: {value: 32, design_choice: "fp32 as distributed (97.8 MB file / 25.56M params = ~4 bytes per weight); reduced-precision variants are separate workloads"}
    flops_per_item: {value: 3.8e9, source: he2016resnet, locator: "Table 1, §4.1 ('3.8 billion FLOPs', FLOPs = multiply-adds)", status: CONFIRMED,
                     note: "Original ResNet-50. torchvision's V1.5 variant reports 'GFLOPS 4.09' with a different counting tool"}
    benchmark:
      name: ImageNet-1K top-1
      unit: "%"
      result: {value: 76.13, source: torchvision_resnet50_weights, locator: "weights table: acc@1", status: CONFIRMED}
    license: {name: BSD-3-Clause (torchvision code), source: torchvision_repo, locator: "GitHub repository licence", status: CONFIRMED,
              note: "Terms of the ImageNet-trained weights not researched (UNVERIFIED)"}

  - id: qwen25-1p5b-inference
    name: Qwen2.5-1.5B base model, inference
    phase: inference
    model_name: Qwen/Qwen2.5-1.5B
    parameters: {value: 1543714304, source: hf_qwen25_15b, locator: "HF API safetensors total", status: CONFIRMED,
                 note: "1.31B non-embedding (qwen2025blog model table)"}
    precision: {value: 16, source: hf_qwen25_15b, locator: "config.json torch_dtype: bfloat16", status: CONFIRMED}
    context_length: {value: 32768, source: qwen2025blog, locator: "model table: context 32K", status: CONFIRMED,
                     note: "config.json max_position_embeddings is 131072"}
    benchmark:
      name: MMLU (base model)
      unit: "%"
      result: {value: 60.9, source: qwen2025blog, locator: "Qwen2.5-0.5B/1.5B/3B performance table", status: CONFIRMED}
    license: {name: Apache-2.0, source: hf_qwen25_15b, locator: "HF API tags (license:apache-2.0); not gated", status: CONFIRMED}
    note: "Chosen for its permissive licence (fault-injection research and redistribution allowed). ~1.5B, slightly above the ~1B target."

  - id: qwen25-1p5b-training-step
    name: Qwen2.5-1.5B, one training step
    phase: training
    model_name: Qwen/Qwen2.5-1.5B
    parameters: {value: 1543714304, source: hf_qwen25_15b, locator: "HF API safetensors total", status: CONFIRMED}
    precision: {value: 16, design_choice: "bf16 mixed-precision training; fp32 master weights and optimizer state are modelled separately in Phase 4"}
    license: {name: Apache-2.0, source: hf_qwen25_15b, locator: "HF API tags (license:apache-2.0); not gated", status: CONFIRMED}
    note: "Training memory (gradients, optimizer state, activations) is several times the weights; Phase 4 defines it."
