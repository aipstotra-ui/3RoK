    see: {no_data: "Neutron studies publish normalized FIT only (dossantos2021due); no absolute proton or heavy-ion rates found"}
    sel: {no_data: "No public SEL data"}

  - id: radhard-sram-ut8rxm39
    name: Frontgrade (CAES) UT8R1M39/2M39/4M39 rad-hard SRAM
    kind: sram
    part: UT8R4M39
    tid:
      - {quantity: tid_rating, effect: TID, kind: rating, value: 100, bound: lower, unit: krad(Si), conditions: "datasheet rating",
         source: frontgrade_ut8rxm39, locator: "Features", status: CONFIRMED}
    see:
      - {quantity: seu_rate_geo_adams90, effect: SEU, kind: rating, value: 7.3e-7, unit: errors/bit-day,
         conditions: "environment-specific: GEO, Adams 90% worst case, 100 mil Al; must not be applied to LEO",
         source: frontgrade_ut8rxm39, locator: "Table 3", status: CONFIRMED, note: "No LEO rate or Weibull parameters given"}
    sel:
      - {quantity: sel_let_threshold, effect: SEL, kind: rating, value: 110, bound: lower, unit: MeV cm2/mg,
         conditions: "no SEL up to LET 110 (datasheet: SEL immune); test temperature not stated",
         source: frontgrade_ut8rxm39, locator: "Features", status: CONFIRMED}
